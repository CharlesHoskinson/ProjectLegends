\* Determinism.tla (Full) Model Configuration
\* NOTE: Full spec includes replay and history -- larger state space.
\* For CI use DeterminismMinimal.cfg instead.

CONSTANTS
    MaxCycles = 20
    MaxInputs = 3
    MaxSteps = 3

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    TraceDeterminism
    HashStability
    ReplayEquivalence

PROPERTIES
    DeterministicExecution
    HashHistoryGrows
