\* Threading.tla (Full) Model Configuration
\* NOTE: Full spec -- may have larger state space.
\* For CI use ThreadingMinimal.cfg.

CONSTANTS
    MaxOperations = 10

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    CoreSingleThreaded
    PALIsolation
    NoDataRaces
    CallStackValid
    OwnerThreadRecorded

PROPERTIES
    AlwaysSafe
    CoreAccessSerialized
    PALThreadsNeverInCore
