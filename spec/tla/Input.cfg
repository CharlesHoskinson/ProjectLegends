\* Input.tla (Full) Model Configuration
\* For CI use InputMinimal.cfg.

CONSTANTS
    MaxInputs = 10
    MaxKeyboardBuffer = 16

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    ScancodeValid
    KeyStateConsistent
    BufferNotCorrupted
    E0PrefixCorrect
    InputDeterminism
    MouseInBounds
    BufferOverflowSafe

PROPERTIES
    NoBufferOverflow
