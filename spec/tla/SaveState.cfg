\* SaveState model configuration
\* Full save-state model with integrity and round-trip checks.

CONSTANTS
    MaxCycle = 20
    MaxCount = 8
    MaxEvents = 4

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    RoundTripInvariant
    SnapshotIntegrityInvariant

PROPERTIES
    SaveLoadCorrect
    EventsPreservedOnLoad
