#
# Tiered triggers (REQ-OPS-004):
#   - PR / push to develop: build + unit tests (~15 min)
#   - PR / push to master: + required ASan/UBSan and fuzz smoke
#   - nightly (cron): soak tests, extended fuzz
#   - tag push (vX.Y.Z): packaging job
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Nightly at 03:00 UTC (soak + fuzz)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Test - Linux (Headless)
  # ─────────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            pkg: gcc-13 g++-13
            extra_cxx_flags: ""
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            pkg: clang-18 libc++-18-dev libc++abi-18-dev
            extra_cxx_flags: "-stdlib=libc++"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build ${{ matrix.pkg }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.extra_cxx_flags }}" \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # REQ-QA-020: Upload visual diff artifacts on test failure
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-headless-${{ matrix.compiler }}
          path: |
            build/tests/**/*_expected.png
            build/tests/**/*_actual.png
            build/tests/**/*_diff.png
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Test - Linux IPC Mode (GPL v2 Process Isolation)
  # ─────────────────────────────────────────────────────────────────────────────
  linux-ipc:
    name: Linux IPC (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13

      - name: Configure (IPC mode)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON \
            -DLEGENDS_USE_IPC=ON

      - name: Build
        run: cmake --build build

      - name: Verify IPC executables exist
        run: |
          test -f build/legends_engine_host && echo "legends_engine_host: OK"
          test -f build/legends_unit_tests && echo "legends_unit_tests: OK"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build - Linux SDL3
  # ─────────────────────────────────────────────────────────────────────────────
  linux-sdl3:
    name: Optional Linux SDL3 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            pkg: gcc-13 g++-13
            extra_cxx_flags: ""
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            pkg: clang-18 libc++-18-dev libc++abi-18-dev
            extra_cxx_flags: "-stdlib=libc++"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build ${{ matrix.pkg }} \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev libxcursor-dev libxss-dev \
            libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgl-dev

      - uses: actions/cache@v4
        with:
          path: build/_deps/sdl3-*
          key: sdl3-linux-${{ matrix.compiler }}-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.extra_cxx_flags }}" \
            -DPAL_BACKEND_SDL3=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Verify executable exists
        run: test -f build/project_legends

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Test - Windows (Headless)
  # ─────────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build `
            -DLEGENDS_BUILD_TESTS=ON `
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # REQ-QA-020: Upload visual diff artifacts on test failure
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-windows
          path: |
            build/tests/**/*_expected.png
            build/tests/**/*_actual.png
            build/tests/**/*_diff.png
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build - Windows SDL3
  # ─────────────────────────────────────────────────────────────────────────────
  windows-sdl3:
    name: Optional Windows SDL3 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps/sdl3-*
          key: sdl3-windows-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -B build `
            -DPAL_BACKEND_SDL3=ON `
            -DLEGENDS_BUILD_TESTS=ON `
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Verify executable exists
        run: |
          if (!(Test-Path build/Release/project_legends.exe)) {
            Write-Error "project_legends.exe not found"
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build and Test - macOS (Headless)
  # ─────────────────────────────────────────────────────────────────────────────
  macos:
    name: Optional macOS (AppleClang)
    runs-on: macos-15
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # REQ-QA-020: Upload visual diff artifacts on test failure
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-macos
          path: |
            build/tests/**/*_expected.png
            build/tests/**/*_actual.png
            build/tests/**/*_diff.png
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build - macOS SDL3
  # ─────────────────────────────────────────────────────────────────────────────
  macos-sdl3:
    name: Optional macOS SDL3 (AppleClang)
    runs-on: macos-15
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps/sdl3-*
          key: sdl3-macos-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPAL_BACKEND_SDL3=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Verify executable exists
        run: test -f build/project_legends

  # ─────────────────────────────────────────────────────────────────────────────
  # Sanitizer Builds (PR + push-to-master + nightly)
  # ─────────────────────────────────────────────────────────────────────────────
  sanitizers:
    name: ${{ matrix.sanitizer }} Sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # R1: no allow_failure. Known TSan races are suppressed via
    # tsan-suppressions.txt (issue-linked). MSan retired (#40).
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # address + undefined + thread only. MSan retired: stock libc++ is not
        # instrumented (crashes on startup). Re-entry:
        # https://github.com/CharlesHoskinson/ProjectLegends/issues/40
        sanitizer: [address, undefined, thread]
        include:
          # Drive sanitizers with g++-13 (native libstdc++ C++23), not clang.
          # clang-18 + -stdlib=libc++ caused mass ASan alloc-dealloc-mismatch
          # (operator new vs free) across exception tests (FINDING-001 #47).
          # clang-18 + default libstdc++ cannot see std::expected: libstdc++
          # gates <expected> on __cpp_concepts >= 202002L, but clang-18 only
          # reports 201907L (configure fail after 26a52ed / d706ff1).
          - sanitizer: address
            flags: "-fsanitize=address -fno-omit-frame-pointer"
            c_flags: "-fsanitize=address -fno-omit-frame-pointer"
            env: "ASAN_OPTIONS=detect_leaks=1:halt_on_error=1"
          - sanitizer: undefined
            flags: "-fsanitize=undefined -fno-omit-frame-pointer"
            c_flags: "-fsanitize=undefined -fno-omit-frame-pointer"
            env: "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          # TSan is enforced. Known races suppressed in tsan-suppressions.txt
          # (one entry per family, issue-linked). Burndown:
          #   #38 g_active_instance / REQ-TH-004
          #   #39 CrashBreadcrumb::add
          # Intentional wrong-thread tests skip under LEGENDS_TSAN_BUILD (#45).
          # Do not re-add allow_failure without a new tracked exit criterion
          # (see CONTRIBUTING.md demotion rule).
          - sanitizer: thread
            # -Wno-error=tsan: g++-13 libstdc++ uses atomic_thread_fence which
            # emits -Wtsan under -fsanitize=thread; project -Werror turns that
            # into a hard build failure in crash_breadcrumb.cpp (and friends).
            flags: "-fsanitize=thread -fno-omit-frame-pointer -Wno-error=tsan"
            c_flags: "-fsanitize=thread -fno-omit-frame-pointer -Wno-error=tsan"
            # Base TSAN_OPTIONS only — suppressions path is set at test time
            # using $GITHUB_WORKSPACE (matrix env cannot reliably expand
            # github.workspace; empty expansion produced suppressions=/...).
            env: "TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          # g++-13: C++23 libstdc++ + ASan/UBSan/TSan. llvm-18: symbolizer for
          # TSan suppressions (still used under GCC TSan runtime).
          sudo apt-get install -y cmake ninja-build g++-13 llvm-18
          if ! command -v llvm-symbolizer >/dev/null 2>&1; then
            if command -v llvm-symbolizer-18 >/dev/null 2>&1; then
              sudo ln -sf "$(command -v llvm-symbolizer-18)" /usr/local/bin/llvm-symbolizer
            elif [ -x /usr/lib/llvm-18/bin/llvm-symbolizer ]; then
              sudo ln -sf /usr/lib/llvm-18/bin/llvm-symbolizer /usr/local/bin/llvm-symbolizer
            fi
          fi

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }} ${{ matrix.linker_flags }}" \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          set -euo pipefail
          export ${{ matrix.env }}
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then
            command -v llvm-symbolizer
            test -f "${GITHUB_WORKSPACE}/tsan-suppressions.txt"
            # Append suppressions with an absolute path at runtime.
            export TSAN_OPTIONS="${TSAN_OPTIONS}:suppressions=${GITHUB_WORKSPACE}/tsan-suppressions.txt"
            echo "TSAN_OPTIONS=${TSAN_OPTIONS}"
          fi
          ctest --test-dir build --output-on-failure

  # ─────────────────────────────────────────────────────────────────────────────
  # C ABI Verification
  # ─────────────────────────────────────────────────────────────────────────────
  abi-check:
    name: C ABI Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify C11 Compatibility
        run: |
          echo "Checking legends_embed.h compiles as pure C11..."
          gcc -std=c11 -fsyntax-only -x c include/legends/legends_embed.h \
            -I include -Werror
          echo "C ABI check passed!"

      - name: Verify Header Guards
        run: |
          echo "Checking header guards..."
          for header in include/legends/*.h; do
            guard=$(head -30 "$header" | grep -E "^#ifndef [A-Z_]+_H$" || true)
            if [ -z "$guard" ]; then
              echo "WARNING: $header may be missing proper header guard"
            fi
          done
          echo "Header guard check complete."

  # ─────────────────────────────────────────────────────────────────────────────
  # Static Analysis (clang-tidy)
  # ─────────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Optional Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [linux]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build clang-18 clang-tidy-18

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Run clang-tidy on engine and legends source
        run: |
          echo "Running clang-tidy on engine and legends source files..."
          find engine/src src/legends -name '*.cpp' -print0 | \
            xargs -0 -r clang-tidy-18 -p build \
              --checks='modernize-*,bugprone-*,performance-*,-modernize-use-trailing-return-type' \
              2>&1 | tee clang-tidy-output.txt

          # Check for errors (warnings are allowed for now)
          if grep -q "error:" clang-tidy-output.txt; then
            echo "clang-tidy found errors!"
            exit 1
          fi
          echo "Static analysis passed (warnings only)."

  # ─────────────────────────────────────────────────────────────────────────────
  # Fuzz Testing (libFuzzer) — PR/push-to-master: quick 30s, nightly: 60s
  # ─────────────────────────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [linux]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          # clang required for -fsanitize=fuzzer (CMake early-outs on non-Clang).
          # Prefer clang-19: reports __cpp_concepts=202002 so libstdc++ exposes
          # std::expected (clang-18 only reports 201907L → configure fail).
          # Stay on pure libstdc++ so Ubuntu libclang_rt.fuzzer links
          # (FINDING-004; libc++ dual-link left std::__cxx11 unresolved).
          # g++-13 keeps a C++23 libstdc++ available on the runner.
          if ! sudo apt-get install -y cmake ninja-build clang-19 g++-13; then
            echo "clang-19 not in default apt; installing via llvm.sh"
            sudo apt-get install -y cmake ninja-build g++-13 wget lsb-release software-properties-common gnupg
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 19
          fi
          command -v clang++-19

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FUZZING=ON \
            -DENABLE_ASAN=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build fuzz targets
        run: cmake --build build --target fuzz-all generate_fuzz_corpus

      - name: Generate seed corpus
        run: |
          ./build/tests/fuzz/generate_fuzz_corpus build/tests/fuzz/corpus
          # libFuzzer requires corpus dirs to exist when a path is passed.
          test -d build/tests/fuzz/corpus/config
          test -d build/tests/fuzz/corpus/engine_memory_blob

      # PR and push-to-master runs: quick 30s smoke test
      - name: "Smoke: Quick fuzz (30s per target)"
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          ./build/tests/fuzz/fuzz_engine_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=30
          ./build/tests/fuzz/fuzz_engine_memory_blob \
            build/tests/fuzz/corpus/engine_memory_blob \
            -max_len=1048576 \
            -max_total_time=30 \
            -print_final_stats=1
          ./build/tests/fuzz/fuzz_legends_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=30
          ./build/tests/fuzz/fuzz_input_injection \
            -max_len=4096 \
            -max_total_time=30
          ./build/tests/fuzz/fuzz_config_parser \
            build/tests/fuzz/corpus/config \
            -max_len=8192 \
            -max_total_time=30

      # Merge-to-main / nightly: full 60s per target
      - name: "Main: Run engine load state fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_engine_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=60

      - name: "Main: Run engine memory blob fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_engine_memory_blob \
            build/tests/fuzz/corpus/engine_memory_blob \
            -max_len=1048576 \
            -max_total_time=60 \
            -print_final_stats=1

      - name: "Main: Run legends load state fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_legends_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=60

      - name: "Main: Run input injection fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_input_injection \
            -max_len=4096 \
            -max_total_time=60

      - name: "Main: Run config parser fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_config_parser \
            build/tests/fuzz/corpus/config \
            -max_len=8192 \
            -max_total_time=60

  # ─────────────────────────────────────────────────────────────────────────────
  # TLA+ Model Checking
  # ─────────────────────────────────────────────────────────────────────────────
  tlaplus:
    name: Optional TLA+ Model Checking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install TLA+ tools
        run: |
          wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -O /tmp/tla2tools.jar

      - name: Run LifecycleMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config LifecycleMinimal.cfg LifecycleMinimal.tla -workers auto

      - name: Run PALMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config PALMinimal.cfg PALMinimal.tla -workers auto

      - name: Run ThreadingMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ThreadingMinimal.cfg ThreadingMinimal.tla -workers auto

      - name: Run SaveStateTest
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SaveStateTest.cfg SaveStateTest.tla -workers auto

      - name: Run DeterminismMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config DeterminismMinimal.cfg DeterminismMinimal.tla -workers auto

      - name: Run CaptureMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config CaptureMinimal.cfg CaptureMinimal.tla -workers auto

      - name: Run InputMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config InputMinimal.cfg InputMinimal.tla -workers auto

      - name: Run ReentrancyMinimal
        run: |
          cd spec/tla
