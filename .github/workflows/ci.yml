#
# Tiered triggers (REQ-OPS-004):
#   - PR / push to develop: build + unit tests (~15 min)
#   - PR / push to master: + required ASan/UBSan and fuzz smoke
#   - nightly (cron): soak tests, extended fuzz
#   - tag push (vX.Y.Z): packaging job
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Nightly at 03:00 UTC (soak + fuzz)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Test - Linux (Headless)
  # ─────────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            pkg: gcc-13 g++-13
            extra_cxx_flags: ""
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            pkg: clang-18 libc++-18-dev libc++abi-18-dev
            extra_cxx_flags: "-stdlib=libc++"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build ${{ matrix.pkg }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.extra_cxx_flags }}" \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # REQ-QA-020: Upload visual diff artifacts on test failure
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-headless-${{ matrix.compiler }}
          path: |
            build/tests/**/*_expected.png
            build/tests/**/*_actual.png
            build/tests/**/*_diff.png
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Test - Linux IPC Mode (GPL v2 Process Isolation)
  # ─────────────────────────────────────────────────────────────────────────────
  linux-ipc:
    name: Linux IPC (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13

      - name: Configure (IPC mode)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON \
            -DLEGENDS_USE_IPC=ON

      - name: Build
        run: cmake --build build

      - name: Verify IPC executables exist
        run: |
          test -f build/legends_engine_host && echo "legends_engine_host: OK"
          test -f build/legends_unit_tests && echo "legends_unit_tests: OK"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build - Linux SDL3
  # ─────────────────────────────────────────────────────────────────────────────
  linux-sdl3:
    name: Optional Linux SDL3 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            pkg: gcc-13 g++-13
            extra_cxx_flags: ""
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            pkg: clang-18 libc++-18-dev libc++abi-18-dev
            extra_cxx_flags: "-stdlib=libc++"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build ${{ matrix.pkg }} \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev libxcursor-dev libxss-dev \
            libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgl-dev

      - uses: actions/cache@v4
        with:
          path: build/_deps/sdl3-*
          key: sdl3-linux-${{ matrix.compiler }}-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.extra_cxx_flags }}" \
            -DPAL_BACKEND_SDL3=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Verify executable exists
        run: test -f build/project_legends

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Test - Windows (Headless)
  # ─────────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build `
            -DLEGENDS_BUILD_TESTS=ON `
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # REQ-QA-020: Upload visual diff artifacts on test failure
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-windows
          path: |
            build/tests/**/*_expected.png
            build/tests/**/*_actual.png
            build/tests/**/*_diff.png
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build - Windows SDL3
  # ─────────────────────────────────────────────────────────────────────────────
  windows-sdl3:
    name: Optional Windows SDL3 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps/sdl3-*
          key: sdl3-windows-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -B build `
            -DPAL_BACKEND_SDL3=ON `
            -DLEGENDS_BUILD_TESTS=ON `
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Verify executable exists
        run: |
          if (!(Test-Path build/Release/project_legends.exe)) {
            Write-Error "project_legends.exe not found"
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build and Test - macOS (Headless)
  # ─────────────────────────────────────────────────────────────────────────────
  macos:
    name: Optional macOS (AppleClang)
    runs-on: macos-15
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # REQ-QA-020: Upload visual diff artifacts on test failure
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-macos
          path: |
            build/tests/**/*_expected.png
            build/tests/**/*_actual.png
            build/tests/**/*_diff.png
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional Build - macOS SDL3
  # ─────────────────────────────────────────────────────────────────────────────
  macos-sdl3:
    name: Optional macOS SDL3 (AppleClang)
    runs-on: macos-15
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps/sdl3-*
          key: sdl3-macos-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPAL_BACKEND_SDL3=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Verify executable exists
        run: test -f build/project_legends

  # ─────────────────────────────────────────────────────────────────────────────
  # Sanitizer Builds (PR + push-to-master + nightly)
  # ─────────────────────────────────────────────────────────────────────────────
  sanitizers:
    name: ${{ matrix.sanitizer }} Sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.allow_failure == true }}
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        sanitizer: [address, undefined, thread, memory]
        include:
          # Note: -stdlib=libc++ is CXX-only; c_flags omit it to avoid -Wunused-command-line-argument
          - sanitizer: address
            flags: "-stdlib=libc++ -fsanitize=address -fno-omit-frame-pointer"
            c_flags: "-fsanitize=address -fno-omit-frame-pointer"
            env: "ASAN_OPTIONS=detect_leaks=1:halt_on_error=1"
          - sanitizer: undefined
            flags: "-stdlib=libc++ -fsanitize=undefined -fno-omit-frame-pointer"
            c_flags: "-fsanitize=undefined -fno-omit-frame-pointer"
            env: "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          # TSan detects pre-existing data races in engine global state
          # (g_active_instance), CrashBreadcrumb::add(), and cross-thread
          # tests that intentionally exercise wrong-thread paths.
          # Mark allow-failure until REQ-TH-004 mixer/global state fixes land.
          # Exit plan (2026-06-10): Sprint 7 tracks removing allow_failure
          # after the remaining engine global-state races are fixed.
          - sanitizer: thread
            flags: "-stdlib=libc++ -fsanitize=thread -fno-omit-frame-pointer"
            c_flags: "-fsanitize=thread -fno-omit-frame-pointer"
            env: "TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1"
            allow_failure: true
          # MSan requires all code (including libc++) to be instrumented.
          # CI uses stock libc++ which is NOT MSan-instrumented, so test
          # executables crash on startup. Mark as allow-failure until we
          # build an instrumented libc++ or switch to a pre-built one.
          # Exit plan (2026-06-10): Sprint 7 tracks replacing stock libc++
          # with an instrumented runtime or retiring the MSan gate.
          - sanitizer: memory
            flags: "-stdlib=libc++ -fsanitize=memory -fPIE -fno-omit-frame-pointer"
            c_flags: "-fsanitize=memory -fPIE -fno-omit-frame-pointer"
            linker_flags: "-pie"
            env: "MSAN_OPTIONS=halt_on_error=1"
            allow_failure: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build clang-18 libc++-18-dev libc++abi-18-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }} ${{ matrix.linker_flags }}" \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          export ${{ matrix.env }}
          ctest --test-dir build --output-on-failure

  # ─────────────────────────────────────────────────────────────────────────────
  # C ABI Verification
  # ─────────────────────────────────────────────────────────────────────────────
  abi-check:
    name: C ABI Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify C11 Compatibility
        run: |
          echo "Checking legends_embed.h compiles as pure C11..."
          gcc -std=c11 -fsyntax-only -x c include/legends/legends_embed.h \
            -I include -Werror
          echo "C ABI check passed!"

      - name: Verify Header Guards
        run: |
          echo "Checking header guards..."
          for header in include/legends/*.h; do
            guard=$(head -30 "$header" | grep -E "^#ifndef [A-Z_]+_H$" || true)
            if [ -z "$guard" ]; then
              echo "WARNING: $header may be missing proper header guard"
            fi
          done
          echo "Header guard check complete."

  # ─────────────────────────────────────────────────────────────────────────────
  # Static Analysis (clang-tidy)
  # ─────────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Optional Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [linux]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build clang-18 clang-tidy-18

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Run clang-tidy on engine and legends source
        run: |
          echo "Running clang-tidy on engine and legends source files..."
          find engine/src src/legends -name '*.cpp' -print0 | \
            xargs -0 -r clang-tidy-18 -p build \
              --checks='modernize-*,bugprone-*,performance-*,-modernize-use-trailing-return-type' \
              2>&1 | tee clang-tidy-output.txt

          # Check for errors (warnings are allowed for now)
          if grep -q "error:" clang-tidy-output.txt; then
            echo "clang-tidy found errors!"
            exit 1
          fi
          echo "Static analysis passed (warnings only)."

  # ─────────────────────────────────────────────────────────────────────────────
  # Fuzz Testing (libFuzzer) — PR/push-to-master: quick 30s, nightly: 60s
  # ─────────────────────────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: [linux]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build clang-18

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FUZZING=ON \
            -DENABLE_ASAN=ON \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build fuzz targets
        run: cmake --build build --target fuzz-all generate_fuzz_corpus

      - name: Generate seed corpus
        run: ./build/tests/fuzz/generate_fuzz_corpus build/tests/fuzz/corpus

      # PR and push-to-master runs: quick 30s smoke test
      - name: "Smoke: Quick fuzz (30s per target)"
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          ./build/tests/fuzz/fuzz_engine_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=30
          ./build/tests/fuzz/fuzz_legends_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=30
          ./build/tests/fuzz/fuzz_input_injection \
            -max_len=4096 \
            -max_total_time=30
          ./build/tests/fuzz/fuzz_config_parser \
            build/tests/fuzz/corpus/config \
            -max_len=8192 \
            -max_total_time=30

      # Merge-to-main / nightly: full 60s per target
      - name: "Main: Run engine load state fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_engine_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=60

      - name: "Main: Run legends load state fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_legends_load_state \
            build/tests/fuzz/corpus \
            -max_len=8192 \
            -max_total_time=60

      - name: "Main: Run input injection fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_input_injection \
            -max_len=4096 \
            -max_total_time=60

      - name: "Main: Run config parser fuzzer (60s)"
        if: github.event_name != 'pull_request'
        run: |
          ./build/tests/fuzz/fuzz_config_parser \
            build/tests/fuzz/corpus/config \
            -max_len=8192 \
            -max_total_time=60

  # ─────────────────────────────────────────────────────────────────────────────
  # TLA+ Model Checking
  # ─────────────────────────────────────────────────────────────────────────────
  tlaplus:
    name: Optional TLA+ Model Checking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install TLA+ tools
        run: |
          wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -O /tmp/tla2tools.jar

      - name: Run LifecycleMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config LifecycleMinimal.cfg LifecycleMinimal.tla -workers auto

      - name: Run PALMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config PALMinimal.cfg PALMinimal.tla -workers auto

      - name: Run ThreadingMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ThreadingMinimal.cfg ThreadingMinimal.tla -workers auto

      - name: Run SaveStateTest
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SaveStateTest.cfg SaveStateTest.tla -workers auto

      - name: Run DeterminismMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config DeterminismMinimal.cfg DeterminismMinimal.tla -workers auto

      - name: Run CaptureMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config CaptureMinimal.cfg CaptureMinimal.tla -workers auto

      - name: Run InputMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config InputMinimal.cfg InputMinimal.tla -workers auto

      - name: Run ReentrancyMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ReentrancyMinimal.cfg ReentrancyMinimal.tla -workers auto

      - name: Run BusMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config BusMinimal.cfg BusMinimal.tla -workers auto

      - name: Run SchedulerMinimal
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SchedulerMinimal.cfg SchedulerMinimal.tla -workers auto

      - name: Run SchedulerTest
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SchedulerTest.cfg SchedulerTest.tla -workers auto

      - name: Run InterruptTest
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config InterruptTest.cfg InterruptTest.tla -workers auto

      - name: Run DMATest
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config DMATest.cfg DMATest.tla -workers auto

      - name: Run SaveState
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config SaveState.cfg SaveState.tla -workers auto

      - name: Run ErrorModel
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ErrorModel.cfg ErrorModel.tla -workers auto

      - name: Run ConfigValidation
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config ConfigValidation.cfg ConfigValidation.tla -workers auto

      - name: Run APIContract
        run: |
          cd spec/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config APIContract.cfg APIContract.tla -workers auto

  # ─────────────────────────────────────────────────────────────────────────────
  # Code Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13 lcov

      - name: Configure with coverage
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --gcov-tool gcov-13 --ignore-errors mismatch,gcov,negative
          lcov --remove coverage.info \
            '/usr/*' '*/build/_deps/*' '*/tests/*' \
            --output-file coverage.filtered.info \
            --ignore-errors unused,empty
          lcov --list coverage.filtered.info
          echo "Coverage policy: report-only; no minimum threshold is enforced by CI yet." > coverage-policy.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.filtered.info
            coverage-policy.txt

      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          file: coverage.filtered.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # REQ-SEC-028: Dependency Vulnerability Scanning
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Optional Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner

      - name: Scan dependencies
        run: |
          ./osv-scanner --lockfile cmake/dependencies.cmake || true
          # Also scan for known CVEs in vendored code
          ./osv-scanner -r engine/ || true
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          path: "*.json"
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Packaging (tag push only)
  # ─────────────────────────────────────────────────────────────────────────────
  packaging:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, linux-sdl3, windows-sdl3, macos-sdl3]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        include:
          - os: ubuntu-latest
            build_type: Release
          - os: windows-latest
            build_type: Release
          - os: macos-15
            build_type: Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13 \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev libxcursor-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libegl-dev libgl-dev

      - uses: actions/cache@v4
        with:
          path: build/_deps/sdl3-*
          key: sdl3-${{ runner.os }}-packaging-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPAL_BACKEND_SDL3=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DPAL_BACKEND_SDL3=ON

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Package
        run: cd build && cpack -C ${{ matrix.build_type }}

      - name: Generate checksums
        run: python3 scripts/generate_checksums.py generate build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            build/*.zip
            build/*.tar.gz
            build/*.dmg
            build/*.exe
            build/SHA256SUMS.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Release Validation (tag push only)
  # ─────────────────────────────────────────────────────────────────────────────
  release-validation:
    name: Release Validation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-13 ninja-build lcov

      - name: Configure with coverage
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DLEGENDS_BUILD_TESTS=ON \
            -DLEGENDS_HEADLESS=ON

      - name: Build
        run: cmake --build build

      - name: Run all tests
        run: |
          cd build
          ctest --label-exclude soak --output-on-failure

      - name: Check coverage
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info --quiet \
            --ignore-errors mismatch,gcov,negative
          lcov --extract coverage.info "*/src/app/*" --output-file coverage_app.info --quiet \
            --ignore-errors unused,empty
          COVERAGE=$(lcov --summary coverage_app.info 2>&1 | grep -oP "lines\.\.\.\.\.\.\:\s+\K[0-9.]+")
          echo "Coverage: ${COVERAGE}%"
          # Check >= 80%
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "FAILED: Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "PASSED: Coverage ${COVERAGE}% meets 80% threshold"

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Verify artifacts exist
        run: |
          echo "Checking for platform artifacts..."
          ls -la package-* || true
          # Verify at least Linux package exists
          test -d package-Linux && echo "Linux artifact: OK"
