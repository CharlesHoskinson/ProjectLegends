name: Sprint 2 Checks

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'docs/architecture/**'
      - 'engine/**'
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sprint2-checks.yml'
      - '.github/baseline_globals.yaml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'docs/architecture/**'
      - 'engine/**'
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sprint2-checks.yml'
      - '.github/baseline_globals.yaml'

jobs:
  globals-registry:
    name: Globals Registry Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check current_context() usage (cpp + headers)
        run: python scripts/check_current_context.py --path .

      - name: Check migration status
        run: python scripts/check_migration_status.py

      - name: Check globals registry (with baseline enforcement)
        run: python scripts/check_globals.py --path .

      - name: Check gsl-lite usage
        run: python scripts/check_gsl_lite_usage.py --path .

      - name: Check unresolved merge conflict markers
        run: python scripts/check_conflict_markers.py --path .

      - name: Check capability matrix drift
        run: python scripts/check_capability_matrix.py --repo .

      - name: Build Graphify ProjectLegends enrichment
        run: >
          python scripts/enrich_graphify_projectlegends.py
          --repo .
          --graphify graphify-out/graph.json
          --out graphify-out/projectlegends-enrichment.json
          --merged graphify-out/projectlegends-graph-enriched.json
          --report docs/architecture/graphify-enrichment-report.md
          --allow-missing-graphify

      - name: Check Graphify ProjectLegends enrichment
        run: >
          python scripts/check_graphify_enrichment.py
          --repo .
          --overlay graphify-out/projectlegends-enrichment.json
          --strict
          --strict-tests fail
          --allow-missing-graphify

  multi-instance-tests:
    name: Multi-Instance Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build g++-13

      - name: Configure build
        run: >
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13
          -DLEGENDS_BUILD_TESTS=ON
          -DLEGENDS_HEADLESS=ON
          -DLEGENDS_LIBRARY_MODE=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build --target legends_unit_tests

      - name: Run multi-instance and contract tests
        run: ./build/legends_unit_tests --gtest_filter="MultiInstance*:Sprint2*:GslContract*:ContractGates*"

      - name: Run full test suite
        run: ./build/legends_unit_tests
